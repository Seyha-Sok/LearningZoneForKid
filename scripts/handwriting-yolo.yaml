# Compact YOLOv8 classification architecture for 32-pixel handwriting.
# Based on Ultralytics yolov8-cls.yaml (AGPL-3.0).
nc: 26
depth_multiple: 0.33
width_multiple: 0.125
backbone:
  - [-1, 1, Conv, [64, 3, 1]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 3, C2f, [512, True]]
head:
  - [-1, 1, Classify, [nc]]
